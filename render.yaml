# Render Blueprint - Infrastructure as Code
# Render detecta este archivo automáticamente

services:
  # Backend API
  - type: web
    name: midas-backend
    env: docker
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_HOST
        sync: false  # Configura manualmente en Render dashboard
      - key: DATABASE_PORT
        value: 5432
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_NAME
        sync: false
      - key: DATABASE_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true  # Render genera un valor aleatorio
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGIN
        value: "*"  # Cambiar en producción real
